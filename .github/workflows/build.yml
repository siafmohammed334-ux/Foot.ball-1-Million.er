name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare www
        run: |
          mkdir www
          cp index.html app.js duel.js auction.js questions.js questions-10.js questions.json style.css config.js cordova.js cordova_plugins.js icon.png logo.jpg www/
          cp questions-add*.js www/ 2>/dev/null || true
          cp -r fonts www/fonts
          sed -i "s#https://raw.githubusercontent.com/[^/]*/[^/]*/main/questions.json#https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/questions.json#" www/config.js
          if [ -f firebase-db-url.txt ]; then URL=$(tr -d ' \r\n' < firebase-db-url.txt); sed -i "s#FIREBASE_DB: \"\"#FIREBASE_DB: \"$URL\"#" www/config.js; fi
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 sharp
          npx cap init "Football Millionaire" com.football.millionaire --web-dir www
          npx cap add android
      - name: App name and icon
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/res/values/strings.xml'
          s = open(p, encoding='utf-8').read()
          for k in ('app_name', 'title_activity_main'):
              s = re.sub(r'(<string name="%s">)[^<]*(</string>)' % k, r'\1الكورة بمليون\2', s)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          node -e "
          const sharp = require('sharp'), fs = require('fs');
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [d, n] of Object.entries(sizes)) {
              const dir = 'android/app/src/main/res/mipmap-' + d;
              for (const f of ['ic_launcher.png', 'ic_launcher_round.png']) await sharp('icon.png').resize(n, n).toFile(dir + '/' + f);
            }
            fs.rmSync('android/app/src/main/res/mipmap-anydpi-v26', { recursive: true, force: true });
          })();
          "
      - name: Use fixed debug keystore
        run: |
          test -f debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
