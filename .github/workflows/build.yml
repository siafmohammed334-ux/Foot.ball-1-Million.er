name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare www
        run: |
          mkdir www
          cp index.html app.js duel.js questions.js questions.json style.css config.js cordova.js cordova_plugins.js icon.png logo.jpg www/
          cp -r fonts www/fonts
          sed -i "s#https://raw.githubusercontent.com/[^/]*/[^/]*/main/questions.json#https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/questions.json#" www/config.js
          if [ -f firebase-db-url.txt ]; then URL=$(tr -d ' \r\n' < firebase-db-url.txt); sed -i "s#FIREBASE_DB: \"\"#FIREBASE_DB: \"$URL\"#" www/config.js; fi
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Football Millionaire" com.football.millionaire --web-dir www
          npx cap add android
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">مليونير كرة القدم</string>#' android/app/src/main/res/values/strings.xml
      - name: App icon
        continue-on-error: true
        run: |
          mkdir assets
          cp icon.png assets/icon-only.png
          npm i @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#050b24' --iconBackgroundColorDark '#050b24'
      - name: Build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
